# One Railway service: Angular + Nest on the same domain (STATIC_DIR).
# Prefer Dockerfile via railway.json when Root Directory is the repo root.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build:monolith"]

[start]
cmd = "npm run start:monolith"
