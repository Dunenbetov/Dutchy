# Monolith without Docker: builds frontend + API, serves SPA via STATIC_DIR.
# Prefer repo-root Dockerfile on Railway (same as selling-tours).
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build -w @dutchy/shared",
  "API_URL=/api node scripts/generate-env.mjs",
  "npm run build -w @dutchy/frontend",
  "npm run build -w @dutchy/backend",
]

[start]
cmd = "STATIC_DIR=apps/frontend/dist/frontend/browser node apps/backend/dist/main.js"
