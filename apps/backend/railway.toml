# One domain: UI + /api. Root Directory = apps/backend (or repo root — see /railway.toml).
[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && npm ci && npm run build:railway"

[deploy]
startCommand = "STATIC_DIR=static node dist/main.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
