# Monolith: build UI + API from repo root (same domain). Root Directory can stay apps/backend.
[build]
builder = "NIXPACKS"
buildCommand = "cd ../.. && npm ci && npm run build:monolith"

[deploy]
startCommand = "cd ../.. && npm run start:monolith"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
